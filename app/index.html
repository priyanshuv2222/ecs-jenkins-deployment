<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevOps Dashboard</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <header>
    <h1>🚀 DevOps Dashboard</h1>
    <button class="deploy-btn">Deploy Now</button>
  </header>

  <section class="stats">
    <div class="card">
      <h2>Builds</h2>
      <p>128</p>
    </div>
    <div class="card">
      <h2>Deployments</h2>
      <p>64</p>
    </div>
    <div class="card">
      <h2>Success</h2>
      <p>98%</p>
    </div>
  </section>

  <section class="services">
    <h2>Services</h2>
    <div class="service-card">
      <span>Frontend</span>
      <span class="status green">Running</span>
    </div>
    <div class="service-card">
      <span>Backend</span>
      <span class="status yellow">Updating</span>
    </div>
    <div class="service-card">
      <span>Database</span>
      <span class="status red">Down</span>
    </div>
  </section>

</body>
</html>
